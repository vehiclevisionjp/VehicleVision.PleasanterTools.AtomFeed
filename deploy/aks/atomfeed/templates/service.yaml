apiVersion: v1
kind: Service
metadata:
  name: {{ include "atomfeed.fullname" . }}
  labels:
    {{- include "atomfeed.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "atomfeed.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
